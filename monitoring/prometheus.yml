global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: redis
    static_configs:
      - targets: ['redis_exporter:9121']

  - job_name: postgres
    static_configs:
      - targets: ['postgres_exporter:9187']

  - job_name: core
    metrics_path: /metrics
    static_configs:
      - targets: ['core:8080']

  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:8080']

  - job_name: sync
    metrics_path: /metrics
    static_configs:
      - targets: ['sync:8080']

  - job_name: broadcasting
    metrics_path: /metrics
    static_configs:
      - targets: ['broadcasting:8080']
